name: Publish to npm

# Publishes only from a tag, only after the full suite and the package-content audit
# pass, and only via OIDC. There is deliberately no NPM_TOKEN anywhere in this file:
# a long-lived publish token in repo secrets is the thing trusted publishing exists
# to remove, and adding one back as a "fallback" would reintroduce exactly that risk.
#
# FIRST RELEASE IS MANUAL. npm cannot configure a trusted publisher for a package
# that does not exist yet, so v1.0.0 has to be published from a laptop by someone
# signed in to npm. Only then can the trusted publisher be configured and every
# later tag published by this workflow. See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate but stop before publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for short-lived publish rights

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to a version that can publish via OIDC
        # Node 22 bundles npm 10.x, which predates trusted publishing entirely.
        run: |
          npm install -g npm@latest
          npm --version

      # No `npm ci`: this package has zero dependencies and ships no lockfile, so
      # `npm ci` would fail on the missing lockfile rather than install nothing.

      - name: Tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        # A tag that disagrees with package.json publishes a version nobody asked
        # for, under a git ref that does not contain it. Fail loudly instead.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Refuse to publish a package still marked private
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "::error::package.json has \"private\": true — npm publish would refuse."
            echo "::error::Remove it deliberately in the release commit, not here."
            exit 1
          fi

      - name: Test suite
        run: npm test

      - name: Audit what the tarball actually contains
        # Runs against the packed tarball, not the working tree, because the files
        # whitelist decides what ships. Strictness follows publishConfig.access:
        # a public package must also carry no org-identifying strings.
        run: |
          ACCESS="$(node -p "require('./package.json').publishConfig?.access ?? 'restricted'")"
          echo "publishConfig.access = $ACCESS"
          node tools/audit-package.mjs --self-test
          if [ "$ACCESS" = "public" ]; then
            node tools/audit-package.mjs --public
          else
            node tools/audit-package.mjs
          fi

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        # No NODE_AUTH_TOKEN. npm >= 11.5.1 detects the Actions OIDC token and
        # exchanges it for a short-lived credential scoped to this package.
        #
        # --provenance is NOT set here. npm does not support provenance generation
        # from a private repository, even when the package itself is public, so
        # requesting it would fail the publish. Add it only if this repo is ever
        # made public — and read the note in RELEASING.md about the fixture blob
        # in git history before doing that.
        run: npm publish

      - name: Dry run summary
        if: inputs.dry_run
        run: |
          echo "All gates passed. Nothing was published (dry_run=true)."
          npm pack --dry-run
